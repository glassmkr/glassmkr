# accept_backlog_or_syn_flood; new rule shipped 2026-05-19 per
# CC_SPEC_CROSS_SNAPSHOT_LIBRARY_2026-05-19.md §3.2.
#
# Classifier rule. Fires P1 when 2 or more of conntrack_exhaustion /
# listen_overflow / tcp_retrans_high have active (unresolved) alerts
# on the same host within a 5-minute window. The combination is
# diagnostic of accept-backlog buildup or a SYN flood; consolidating
# these into one incident reduces alert spam.
#
# Current status: conntrack_exhaustion exists in the rule library;
# listen_overflow + tcp_retrans_high do NOT yet exist. This rule
# ships structurally complete but will not fire until at least two
# of the three subordinate rules are live and emitting on the same
# host. The classifier is a forward-compatible declaration; once
# the subordinates exist (future Crucible field additions + Dashboard
# rule activation), the classifier consolidates automatically.
#
# Pre-pass: declares a `cross_snapshot.correlate_with` block. No
# snapshot history needed; the rule only consults the active_alerts
# state of the listed subordinates. window: { count: 1 } keeps the
# pre-pass cheap.
#
# Incident grouping: when this rule fires, its subordinates do NOT
# also page (the subordination logic in routeAlertEmission honours
# subordinate_to relationships set by the subordinate rules; see
# subordination.ts). For now those subordinate YAMLs do not yet
# declare `subordinate_to: accept_backlog_or_syn_flood`; that should
# be added when the subordinate rules ship to ensure correct
# parent-child collapse.
id: accept_backlog_or_syn_flood
priority: P1
title: Accept backlog or SYN flood
summary: 2 or more of conntrack_exhaustion / listen_overflow / tcp_retrans_high are active on the same host within 5 minutes. Indicates accept-queue buildup or SYN flood.
incident_group:
  group_id: accept_backlog_or_syn_flood
  correlation_window_seconds: 300
cross_snapshot:
  window:
    count: 1
  columns:
    - timestamp
  parsed: false
  correlate_with:
    rule_ids:
      - conntrack_exhaustion
      - listen_overflow
      - tcp_retrans_high
    window_seconds: 300
fix:
  quick_check:
    command: |
      ss -lntpe | head -20
      nstat -az TcpExtListenOverflows TcpExtListenDrops TcpExtTCPSynRetrans 2>/dev/null
      # Distribution of SYN sources right now:
      sudo ss -tn state syn-recv 2>/dev/null | awk 'NR>1 {print $4}' | cut -d: -f1 | sort | uniq -c | sort -rn | head -10
    description: "Per-listener queue depth + the three counters that distinguish 'legit traffic spike' from 'SYN flood' + the top sources of half-open connections. Many sources, low ratio = real traffic; few sources, high ratio = flood."
  verdict_prior: investigation
  prerequisites:
    - SSH access
    - Awareness of which public-facing services on this host accept TCP connections
    - Ability to add nftables / iptables rules (root)
  safe_mode:
    command: |
      ss -ntl | head -20
      ss -nts | head
      cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null || true
      cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null || true
      cat /proc/net/netstat | grep -E "ListenDrops|ListenOverflow|TCPSynRetrans" | head
    description: |
      Read-only triage. Inspect listen queues, conntrack utilisation,
      and kernel TCP counters. A high ListenDrops rate alongside
      saturated conntrack is the canonical accept-backlog pattern; a
      high TCPSynRetrans rate paired with one or both is the SYN-
      flood pattern.
  variants:
    - distro_match: ["*"]
      vendor_match: ["*"]
      command: |
        # Quick triage: who's connecting in flight?
        ss -nt state syn-recv | head -50
        ss -nt | awk '{print $5}' | cut -d: -f1 | sort | uniq -c | sort -rn | head -20

        # If a single source IP dominates SYN-RECV counts, treat as
        # an attack and add a temporary nftables rate-limit:
        # sudo nft add rule inet filter input ip saddr <attacker_ip> \
        #   meter syn_flood { ip saddr limit rate 25/second } accept

        # If the source is distributed (likely a real load spike),
        # raise the accept queue and SYN backlog:
        sysctl net.core.somaxconn
        sysctl net.ipv4.tcp_max_syn_backlog
        # Stop-gap tuning (do not commit to /etc/sysctl.d/ without
        # operator sign-off):
        # sudo sysctl -w net.core.somaxconn=4096
        # sudo sysctl -w net.ipv4.tcp_max_syn_backlog=8192
      description: |
        Two paths: SYN flood (distinguished by concentrated source IPs
        and very high SYN-RECV count) calls for rate limiting; legit
        load spike calls for backlog tuning. ss/netstat counters
        distinguish the two. Once tuned, the subordinate rules drop
        out of firing and the classifier auto-resolves.
  validation:
    command: |
      ss -nts
      cat /proc/sys/net/netfilter/nf_conntrack_count
    description: |
      The classifier auto-resolves when fewer than 2 subordinates
      remain in active_alerts on this host. The 5-minute window
      means resolution lags the subordinates by up to 5 minutes.
  rollback:
    available: true
    command: |
      # Revert the sysctl changes:
      sudo sysctl -w net.core.somaxconn=128
      sudo sysctl -w net.ipv4.tcp_max_syn_backlog=512
      # Remove the rate-limit rule:
      # sudo nft delete rule inet filter input handle <handle>
    note: |
      Rate-limit rules are reversible by deleting the rule handle
      (find via `nft -a list ruleset`). Sysctl tuning is reversible
      by writing the prior values back.
  impact:
    blast_radius: |
      The alert itself has no service impact. Backlog tuning is
      non-disruptive (kernel-side change applies to new connections
      immediately, no service restart). Rate limiting a source IP
      can break legitimate clients if mis-targeted; verify the
      source IP distribution before adding the rule.
    estimated_duration: |
      Triage 5-15 min; mitigation 5-30 min depending on path.
    irreversible_steps: false
  provenance:
    last_verified: "2026-05-19"
    tested_on:
      - Synthetic correlation test fixtures (vitest)
    tester: Glassmkr ops
    research_basis: operator-pattern
    source_note: |
      Pattern library 2026-05-18 Category 4 (Network). Classifier for
      accept-backlog incidents that otherwise produce parallel alerts
      on conntrack, listen overflow, and TCP retransmits. Per pattern
      library principle 5: cross-rule correlation reduces spam by
      consolidating into one incident. Ships structurally complete
      but will not fire until 2+ subordinates are alive in the rule
      library and emitting on the same host; conntrack_exhaustion
      exists today, listen_overflow + tcp_retrans_high are deferred
      to a future Crucible field + Dashboard rule activation cycle.
