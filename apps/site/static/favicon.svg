<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Solid fills on purpose: the previous mark used opacity, which reads as
       pale cream when a renderer composites it onto white (chat link previews,
       light tab bars). Two solid ambers keep the faceted look on any ground. -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#D4820A"/>
  <polygon points="16,2 28,9 16,16 4,9" fill="#F5A623"/>
</svg>
