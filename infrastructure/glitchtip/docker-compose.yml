# GlitchTip self-hosted error tracking for Dashboard.
#
# See DEPLOY.md in this directory for the full walkthrough. This
# file is the recipe; the README explains how to use it.
#
# Components:
#   - glitchtip (Django web)     gunicorn behind reverse proxy on :8000
#   - glitchtip-worker           Celery worker for ingest + emails
#   - glitchtip-migrate          one-shot migration runner
#   - postgres                   GlitchTip's database (NOT the guardian DB)
#   - redis                      Celery broker + cache
#
# The two services that listen on the network are postgres (in-network only)
# and the GlitchTip web (proxied by host nginx via 127.0.0.1:8001). No
# ports are published to the public internet directly from this compose.
#
# Note: the GlitchTip image runs uWSGI on port 8080 by default (its
# start.sh does `${PORT:-8080}`). We map host 8001 -> container 8080,
# NOT container 8000 — even though `EXPOSE 8000` appears in the image
# manifest, nothing actually listens there.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-glitchtip}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration runner. Runs to completion on every `up`,
  # which is a no-op when there's nothing to apply. Keeps the web
  # container's startup deterministic.
  glitchtip-migrate:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-v4.2}
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    command: ./bin/run-migrate.sh
    restart: "no"

  glitchtip:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-v4.2}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
    env_file: .env
    ports:
      # Bind to loopback only. Host nginx terminates TLS and proxies
      # in. Never publish this to 0.0.0.0.
      #
      # Container port is 8080 (uWSGI default in the GlitchTip image),
      # not 8000. The image's EXPOSE 8000 is misleading; nothing
      # listens there.
      - "127.0.0.1:8001:8080"
    volumes:
      - ./data/uploads:/code/uploads

  glitchtip-worker:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-v4.2}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
    env_file: .env
    command: ./bin/run-celery-with-beat.sh
    volumes:
      - ./data/uploads:/code/uploads
