# ground-truth.yaml: the canonical map from every externally stated product
# fact to its source of truth. Pivot-owned (OSS pivot, 2026-08); consumed by
# the website, README generation, announcement drafts, documentation, redesign
# capture provenance, and the later Hermes operator's glassmkr-ground-truth
# skill.
#
# Rules:
# - A claim with no resolvable source here must not ship. "unresolved" facts
#   are blocked from publication and queued for Simon.
# - Consumers read the referenced source or a generated output of it; never
#   hand-copy a mutable value into a second file.
# - Commands are deterministic, repository-local, read-only, CI-usable, and
#   run from this repository's root unless the entry says otherwise.
# - scripts/check-ground-truth.mjs is the drift check; CI-runnable.
#
# status values: resolved | human_locked_pending (owner must set the value) |
# unresolved_verify (claim exists, source needs verification before flip).

meta:
  owner: oss-pivot
  created: 2026-08-24
  drift_check: scripts/check-ground-truth.mjs
  companion_repo: ~/claude_codes/crucible (the agent; separate checkout)

facts:
  crucible_license:
    status: resolved
    value: "AGPL-3.0-only from v1.1.0 onward (repo main relicensed 2026-08-29, Simon's decision); v1.0.1 and earlier were PUBLISHED under MIT and remain MIT irrevocably"
    source_type: package_metadata
    source_path: "crucible repo: package.json .license + LICENSE (both AGPL-3.0-only on main)"
    command: "npm view @glassmkr/crucible license   # says MIT until v1.1.0 publishes; the repo LICENSE is the forward claim"
    rule: >-
      Copy and descriptions state AGPL-3.0-only plainly, with NO license-history
      note (Simon, 2026-08-29). The MIT history lives only where it is
      load-bearing: the crucible CHANGELOG record, Terms section 12 (which
      license governs the version you hold), and dated changelog entries.
      Never state that old MIT artifacts became AGPL; a granted license is not
      retractable. Relicensing was legally clean: every commit author identity
      in the crucible repo belongs to the copyright holder (verified via
      git shortlog -sne --all, 2026-08-29).
    consumers: [website, README, announcement, docs, trust]

  dashboard_license:
    status: resolved
    value: AGPL-3.0-only
    source_type: license_file
    source_path: "LICENSE (monorepo root, canonical gnu.org text) + package.json license fields (root and every app/package manifest)"
    command: "node -p \"require('./package.json').license\""
    rule: "the -only is part of the claim; SPDX identifier used verbatim in metadata, badges, and ground-truth; decided round-2 s1 (2026-08-24), dependency scan ran clean first"
    consumers: [website, README, announcement, docs, trust, repo_metadata]

  third_party_notices:
    status: resolved
    source_type: generated
    source_path: "THIRD_PARTY_NOTICES.md (this repo, from scripts/gen-third-party-notices.mjs over the prod lockfile graph) + crucible repo THIRD_PARTY_NOTICES.md (full texts, 3-package tree)"
    command: "pnpm licenses list --prod --json | node scripts/gen-third-party-notices.mjs"
    rule: "regenerated per release in CI (launch gate 11); scan verdict 2026-08-24: no AGPL-incompatible production dependency; FSL-1.1-MIT @sentry/cli is build-time only"
    consumers: [repo_metadata, docs, trust]

  crucible_version:
    status: resolved
    source_type: registry_with_committed_fallback
    source_path: "npm dist-tags.latest for @glassmkr/crucible; committed fallback apps/site/src/lib/crucible-version.ts (FALLBACK_CRUCIBLE_VERSION, bumped only AFTER npm shows the version; gen-rules.mjs mirrors it, bump in lockstep)"
    command: "npm view @glassmkr/crucible version"
    consumers: [website_hero, captures, release_notes, announcement]

  rule_count:
    status: resolved
    source_type: generated
    source_path: "apps/site/src/lib/data/rules.json (generated by apps/site/scripts/gen-rules.mjs from apps/dashboard/src/lib/server/alerts/rules/*.yaml; generator hard-fails on an unmapped rule)"
    command: "node -p \"require('./apps/site/src/lib/data/rules.json').length\""
    rule: "never quote a literal count anywhere; import rules.json and use .length"
    consumers: [website, README, announcement, docs, JSON-LD]

  hosted_node_cap:
    status: resolved
    value: 10
    source_type: configured
    source_path: "apps/site/src/lib/product-facts.ts (HOSTED_NODE_CAP; display) + dashboard plan_server_limit for the hosted Free plan (enforcement; prod change at flip) + round-2 G4 hard refusal at node 11"
    command: "node -p \"require('./apps/site/src/lib/data/product-facts.json').hostedNodeCap\""
    rule: "confirmed by round-2 s2 FAQ copy (2026-08-24); node 11 refuses cleanly, no partial state"
    consumers: [pricing, homepage_comparison, announcement, docs, faq]

  self_hosted_registration_control:
    status: resolved
    value: "GLASSMKR_DISABLE_REGISTRATION=1 (also true, yes; case-insensitive)"
    source_type: code
    source_path: "apps/dashboard/src/lib/server/auth/registration.ts (registrationDisabled) + api/v1/auth/register (403) + routes/auth/callback/{github,google} (refuse new-account creation; existing identities still sign in)"
    command: "grep -rn registrationDisabled apps/dashboard/src | grep -v __tests__"
    rule: "off by default so the documented first-run flow works; closes every account-CREATING path, not just the password form; signing in to an account that already exists is unaffected. Enforced by registration-disabled.test.ts, which asserts the guard precedes account creation in both OAuth callbacks"
    consumers: [self_hosting_docs, announcement]

  collectd_parity_counts:
    status: resolved
    value: "63 rows: 21 covered, 16 partial, 26 gap"
    source_type: generated
    source_path: "docs/COLLECTD_PARITY.md in the crucible repo (the row status column is the only source; the site and the announcement quote it)"
    command: "grep -oiE '\\| *(covered|partial|gap) *\\|' ../crucible/docs/COLLECTD_PARITY.md | tr -d '| ' | tr A-Z a-z | sort | uniq -c"
    rule: "26 gap rows exceed 21 covered, so collectd reads MORE distinct things than Crucible. No surface may imply breadth superiority; state the tally plainly and claim depth instead. Checked by scripts/check-ground-truth.mjs when the crucible repo is present"
    consumers: [vs_collectd, announcement]

  self_hosted_mcp_requirements:
    status: resolved
    value: "ships in the box, OFF by default, requires TLS in front plus MCP_OAUTH_ENABLED, MCP_READ_ENABLED, MCP_PUBLIC_ORIGIN and a 32-byte MCP_OAUTH_TOKEN_PEPPER"
    source_type: code
    source_path: "apps/dashboard/src/lib/server/oauth/constants.ts (enabled() requires the literal \"1\"; getMcpPublicOrigin() throws on a non-HTTPS origin when NODE_ENV is production, which docker-compose.yml sets) + oauth/crypto.ts (pepper must be at least 32 bytes or it throws)"
    command: "grep -n 'NODE_ENV === \"production\"' apps/dashboard/src/lib/server/oauth/constants.ts"
    rule: "No surface may say self-hosted MCP works out of the box. It cannot be defaulted on: with NODE_ENV=production and an http origin the OAuth server refuses to start, so flipping the flags would ship something broken. Say it ships in the box, needs TLS in front, and name the variables. Fixing this properly is the deferred MCP https-callback item"
    consumers: [self_hosting_docs, pricing, homepage_offer, announcement]

  operator_identity:
    status: resolved
    value: "one person; no company entity claimed publicly"
    source_type: operator_attested
    source_path: "Simon, decision 2026-08-26 (final taste pass, section 1). Corroborated by /trust's GDPR posture, which states Czech sole-trader registration"
    command: "grep -rn 'small team\\|team of engineers\\|EU company' apps/site/src"
    rule: "Glassmkr is built and operated by one person. No surface may claim a team, and none may claim a company entity: a sole trader is not a company, and Simon chose to make no entity claim publicly. The GDPR posture on /trust is the one place registration is mentioned, because it is legally relevant there. Never cite an employer's location count (the old '60+ global locations' was DataPacket's footprint, not Glassmkr's) as Glassmkr credibility"
    consumers: [about, trust, pricing, announcement]

  data_residency:
    status: resolved
    value: "Amsterdam, Netherlands: primary Postgres and ClickHouse, and daily encrypted backups on a second server in the same datacenter"
    source_type: operator_attested
    source_path: "Simon, operator attestation 2026-08-24 (hosted service and GPU servers physically in Amsterdam), extended 2026-08-26 to cover backups"
    command: "grep -rn 'EU-stored\\|Amsterdam' apps/site/src/routes/trust"
    rule: "This is what grounds the EU-stored data claim on /trust: both the live databases and the backups are in Amsterdam. If backups ever move outside the EU, the claim must change with them"
    consumers: [trust, footer, privacy]

  hosted_pricing_state:
    status: resolved
    value: "free (hosted); free forever (self-hosted, AGPL)"
    source_type: decision
    source_path: "GLASSMKR_REDESIGN_FINAL_SPEC.md sections 14.6/15.2 + CC_OSS_PIVOT_SITE; billing code retained behind GLASSMKR_SELF_HOSTED flag (apps/dashboard/src/lib/server/self-hosted.ts)"
    rule: "no per-node price on any active surface; 'free forever' only for self-host"
    consumers: [pricing, homepage, announcement, docs, vs_pages]

  compose_quickstart:
    status: resolved
    source_type: canonical_doc_block
    source_path: "SELF_HOSTING.md, the fenced block under '## Quickstart' (4 lines: git clone / cd / cp env.selfhost.example / docker compose up -d)"
    command: "node scripts/check-ground-truth.mjs --only quickstart"
    rule: "byte-identical on every surface that shows it (homepage hero, /docs/self-hosting, future README); never hand-typed twice"
    consumers: [homepage_hero, docs_self_hosting, README, announcement]

  agent_install_paths:
    status: resolved
    source_type: shipped_artifacts
    source_path: "apps/site/static/install.sh (curl path; Ubuntu/Debian only, requires --api-key, --ingest-url for self-host); npm @glassmkr/crucible (manual path, any distro with Node >= 22.19.0); single-file binaries attach to GitHub Releases from v1.0.0 (crucible publish.yml binaries job)"
    rule: "install.sh supports Ubuntu/Debian ONLY; do not claim one-line install for RHEL-family; binaries must exist on a Release before any surface describes them as available"
    consumers: [docs_install, homepage_install_section, README, for_pages]

  supported_os:
    status: resolved
    source_type: repo_doc
    source_path: "crucible repo README '## Requirements': Linux (Ubuntu, Debian, RHEL, Rocky, Alma, Arch, Alpine), Node >= 22.19.0 for npm path; binary path needs no Node"
    rule: "runtime support is broader than install.sh support; keep the two claims distinct"
    consumers: [docs, README, for_pages]

  telemetry_sources:
    status: resolved
    source_type: agent_source
    source_path: "crucible repo src/collect/* + the 27 fixed-argv wrapper actions (src/lib/privileged.ts); public inventory on /trust"
    rule: "the agent ships bounded log excerpts, not 'no logs' (corrected in crucible #555; never re-tighten the claim)"
    consumers: [trust, homepage, docs]

  inbound_ports:
    status: resolved
    value: "none by default; optional Prometheus listener (prometheus.enabled) binds 127.0.0.1:9101, unauthenticated, documented"
    source_type: agent_source
    source_path: "crucible repo src/metrics-server.ts + config default prometheus.enabled=false"
    rule: "say 'opens no inbound ports by default'; do not omit the opt-in listener when precision matters (trust page)"
    consumers: [trust, homepage_install_section, README, SECURITY_md]

  privilege_boundary:
    status: resolved
    value: "runs as unprivileged glassmkr user; privileged reads via one fixed-argv sudo wrapper (/usr/local/sbin/crucible-collect), allowlisted action set, exit 64/65 on violations"
    source_type: agent_source
    source_path: "crucible repo src/lib/privileged.ts + SECURITY.md"
    rule: "never describe the agent as rootless without naming the wrapper boundary"
    consumers: [trust, homepage, README, SECURITY_md]

  signature_verification:
    status: resolved
    value: "npm releases: OIDC Trusted Publishing with --provenance; binaries: SHA256SUMS and a CycloneDX SBOM attached by CI, plus a per-binary GitHub build-provenance attestation created before upload (verify: gh release download, then gh attestation verify <file> --repo glassmkr/crucible); install.sh does NOT verify signatures"
    source_type: ci_workflow
    source_path: "crucible repo .github/workflows/publish.yml + scripts/build-binaries.sh (scripts/sign-release.sh and manual GPG signing were retired with the move to attestations; RELEASE.md step 8a)"
    rule: "never claim the installer verifies signatures; it does not; never describe GPG signing as current"
    consumers: [trust, docs_install, README, SECURITY_md]

  retention:
    status: resolved
    value: "snapshots 90 days, alert history 365 days, analyses and notification log 90 days; identical in both deployment forms"
    source_type: schema_ttl
    source_path: "migrations/clickhouse/001_initial.sql: TTL clauses at the snapshots (line 50), alert_history (67), analyses (82), and notification_log (97) tables; unchanged by migrations 002-006. Supplementary sweep: apps/dashboard/src/routes/api/v1/admin/retention/+server.ts (RETENTION_DAYS, which must equal the snapshots TTL)."
    command: "/usr/bin/grep -n 'TTL toDateTime' migrations/clickhouse/001_initial.sql"
    rule: >-
      The table TTL is the authoritative enforcement and needs no cron. Retention is
      NOT deployment-dependent: a self-hosted instance runs the same migrations, so
      "retention is whatever your disk holds" is FALSE and must never be published;
      the true statement is 90 days by default, changeable by editing the table TTL
      on your own instance (documented in SELF_HOSTING.md). Corrected 2026-08-25
      after two /vs/prometheus claims were found contradicting the schema, and after
      the retention sweep was found deleting non-pro accounts at 7 days, which would
      have falsified the published number.
    verification_pending: "deletion-actually-occurs proof on a live table runs with the compose stack on the validation fleet (launch gate 3); the TTL clause itself is verified in the schema"
    consumers: [pricing, docs, faq, homepage_comparison, vs_pages, trust]

  hosting_location:
    status: resolved
    value: "Amsterdam"
    source_type: operator_attested
    source_path: "Simon, operator attestation 2026-08-24 (round-2 s7)"
    rule: "may be claimed where useful; re-attest if the hosted instance ever moves"
    consumers: [homepage_comparison, trust]

  notification_channels:
    status: resolved
    source_type: dashboard_source
    source_path: "apps/dashboard/src/lib/server/alerts/dispatcher.ts + channel modules (email.ts etc.); site copy says six: Telegram, Slack, Discord, PagerDuty, email, webhook"
    command: "/usr/bin/grep -c 'case' apps/dashboard/src/lib/server/alerts/dispatcher.ts"
    rule: "verify the six-channel list against dispatcher.ts before quoting it in new copy"
    consumers: [website, docs, README]

  repositories:
    status: resolved
    value:
      crucible: "https://github.com/glassmkr/crucible (public today, AGPL-3.0-only from v1.1.0)"
      dashboard: "https://github.com/glassmkr/glassmkr (NOT YET PUBLIC; fresh squashed history at flip; all links to it are staged and must resolve before deploy, launch gate)"
    source_type: github
    consumers: [website, README, announcement, nav, footer]

  docs_urls:
    status: resolved
    source_type: site_routes
    source_path: "apps/site/src/routes/docs/* (every /docs/<slug> has a .md twin via scripts/docs-md.mjs; new slugs registered in STATIC_DOC_SLUGS)"
    consumers: [website, README, announcement, llms_txt]

  ai_analysis:
    status: resolved
    value: "self-hosted: any OpenAI-compatible endpoint via LLM_API_URL/LLM_MODEL, off when unset; hosted: enabled, self-hosted Gemma on Glassmkr's own GPU (no third-party model APIs)"
    source_type: dashboard_source
    source_path: "dashboard LLM_API_URL wiring + SELF_HOSTING.md AI section + /trust"
    rule: "never present AI as the headline; monitoring first (redesign spec 14.4)"
    consumers: [docs_self_hosting, trust, pricing, homepage_alert_exhibit]

  client_ip_derivation:
    status: resolved
    value: "rightmost X-Forwarded-For entry (the nginx-appended real peer); never the leftmost, never a client-supplied entry"
    source_type: infrastructure_plus_source
    source_path: "infrastructure/nginx/sites/app.glassmkr.com lines 27-28 and 35-36 (proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for, which APPENDS $remote_addr) + apps/dashboard/src/lib/server/auth/source-ip.ts (getSourceIp)"
    command: "npx vitest run src/lib/server/auth/__tests__/source-ip-spoofing.test.ts (from apps/dashboard)"
    rule: "every rate-limit bucket key and audit row derives from getSourceIp; a client-supplied X-Forwarded-For cannot influence either (proven by the spoofing test, round-3 item 1, verified 2026-08-25). ASSUMPTION: exactly one trusted proxy hop that appends last. If Cloudflare proxying is added in front, the derived value becomes the CF edge IP: fix belongs in nginx (set_real_ip_from + real_ip_header CF-Connecting-IP), not in app code."
    consumers: [trust, SECURITY_md, internal_ops]

  outbound_destinations:
    status: resolved
    value: "agent: the configured dashboard.url only, plus optional operator-configured Telegram/Slack/email notification endpoints; no other destination, no telemetry service"
    source_type: agent_source
    source_path: "crucible repo src/push/dashboard.ts + src/notify/* + endpoint policy (src/lib/endpoint-policy.ts); public claim on /trust"
    consumers: [trust, README, SECURITY_md, HN_answers]

  secrets_storage:
    status: resolved
    value: "agent: per-server key in /etc/glassmkr/crucible.yaml, root-owned, mode-checked at load (O_NOFOLLOW + uid/mode + ACL refusal); dashboard: keys stored as HMAC-peppered hashes (GLASSMKR_KEY_PEPPER), shown once at issuance"
    source_type: source_code
    source_path: "crucible repo src/config.ts (assertSecureConfigStat) + dashboard account_api_keys key_hash + env.selfhost.example pepper note"
    consumers: [trust, docs_self_hosting, SECURITY_md]

  node_floor:
    status: resolved
    value: "22.19.0"
    source_type: package_metadata
    source_path: "crucible repo package.json engines.node; the floor is undici@8's own engines.node, moves only with an undici bump (RELEASE.md 9a)"
    command: "npm view @glassmkr/crucible engines.node"
    consumers: [docs_install, README, for_pages]

  binary_architectures:
    status: resolved
    value: "linux-x64, linux-arm64 (single-file, no Node required); npm package for everything else"
    source_type: ci_workflow
    source_path: "crucible repo scripts/build-binaries.sh + publish.yml binaries job; assets exist from v1.0.0 on"
    rule: "no surface describes binaries as available until a Release carries them (launch gate)"
    consumers: [docs_install, README, homepage_install_section]

  compose_requirements:
    status: resolved
    value: "Docker with the compose plugin; dashboard listens on port 3000 (DASHBOARD_PORT overridable); volumes pgdata + chdata; required secrets DB_PASSWORD + GLASSMKR_KEY_PEPPER"
    source_type: source_code
    source_path: "docker-compose.yml + env.selfhost.example + SELF_HOSTING.md prerequisites"
    consumers: [docs_self_hosting, README, homepage]

  data_semantics:
    status: resolved
    value: "snapshots roughly every 5 minutes (collection.interval_seconds default 300, floor 60); dashboard accepts at most one ingest per server per 55s; alert evaluation runs on each accepted snapshot"
    source_type: source_code
    source_path: "crucible repo src/config.ts interval default + dashboard src/lib/server/ingest/lifecycle.ts RATE_LIMIT_WINDOW_MS + ingest route evaluator call"
    rule: "never claim high-frequency monitoring; sub-interval transients can be missed (collectd parity caveat 1)"
    consumers: [docs, trust, vs_pages, homepage]

  hosted_selfhost_parity:
    status: resolved
    value: "same codebase and feature set; differences: hosted has the node cap and operator-managed AI analysis; self-hosted has no limits and brings its own LLM endpoint (LLM_API_URL) and email key (RESEND_API_KEY)"
    source_type: source_code
    source_path: "apps/dashboard/src/lib/server/self-hosted.ts (the exhaustive flag contract in its header comment)"
    consumers: [pricing, docs_self_hosting, faq, announcement]

  evidence_provenance:
    status: resolved
    value: "a public exhibit is a genuine capture from the validation fleet or hosted validation instance, or a recorded-data render of the real component; visible provenance line (captured date, public-safe host, crucible version, scenario id) as real HTML text; machine-readable manifest with sha256, verified in CI; no retyped values, no composited states, no invented output"
    source_type: decision
    source_path: "docs/design/GLASSMKR_REDESIGN_FINAL_SPEC.md sections 7.2-7.7"
    rule: "until a valid capture source exists, exhibits carry a NON-SHIPPING marker that launch-integrity fails on"
    consumers: [homepage, blog, README, captures]

  honesty_constraints:
    status: resolved
    value: "no NVLink saturation monitoring; no failure prediction of any kind; no InfiniBand claims; /for-gpu 'Where we stop' section is verbatim-locked; cadence is ~5-minute polling, never claim high-frequency parity"
    source_type: decision
    source_path: "GPU research (855-day study) + crucible docs/COLLECTD_PARITY.md honesty caveats + OSS runbook never-list"
    consumers: [for_gpu, vs_pages, announcement, any_gpu_copy]
