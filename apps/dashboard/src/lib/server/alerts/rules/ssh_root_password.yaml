# ssh_root_password; deepened 2026-05-17 per
# CC_FIX_WORKFLOW_DEEPENING_2026-05-17.md B8.
#
# Single-severity rule (always warning). No condition_match split.
# Light distro_match split because the sshd service unit name differs:
#   - Debian/Ubuntu: `ssh`
#   - RHEL family:   `sshd`
# Same fix flow + same config file path; only the systemctl reload
# target changes. Choosing distro_match over a single variant with
# both names so the command is copy-pasteable on each host class.
id: ssh_root_password
priority: P1
title: SSH allows root password login
summary: sshd allows root login with password. Brute-force-able from the network. Switch to key-only root login (still works for key-based ops); ideally disable root SSH entirely and use a sudo-equipped operator account.
fix:
  quick_check:
    command: |
      sudo sshd -T 2>/dev/null | grep -iE 'permitrootlogin|passwordauthentication|kbdinteractiveauthentication|usepam'
    description: "Effective sshd config (what sshd actually parsed, after Includes and Match blocks). PermitRootLogin=yes is the alert; PasswordAuthentication=yes with key auth is less severe but worth knowing."
  verdict_prior: recoverable
  prerequisites:
    - SSH access via a non-root account with sudo (or another way to recover if the change locks you out; see below)
    - "Working SSH key for at least one account on the host: confirm `ssh user@host` works before changing sshd config"
    - Awareness that running `systemctl reload sshd` does NOT drop existing sessions; current SSH session stays open during the change
    - "For consumer / VPS hosts without console access: a fallback recovery method (cloud-init reset, hosting-panel password reset) in case key auth fails after the change"
  safe_mode:
    command: |
      sudo sshd -T | grep -iE 'permitrootlogin|passwordauthentication|pubkeyauthentication'
      grep -iE '^permitrootlogin|^passwordauthentication' /etc/ssh/sshd_config
      ls -la /etc/ssh/sshd_config.d/ 2>/dev/null
      cat /etc/ssh/sshd_config.d/*.conf 2>/dev/null
      last -F | head -10
    description: |
      Read-only inspection. `sshd -T` prints the EFFECTIVE config
      (after merging all drop-ins under sshd_config.d/), which is
      what the daemon actually applies. The grep on /etc/ssh/sshd_config
      shows the literal values; mismatch between sshd -T output and
      grep means a drop-in overrides; common on modern distros.
      `last -F` shows recent successful logins so you can confirm
      key auth is working for at least one account.
  variants:
    - distro_match: ["debian-*", "ubuntu-*"]
      vendor_match: ["*"]
      suggested_action: |
        printf 'PermitRootLogin prohibit-password\nPasswordAuthentication no\n' | sudo tee /etc/ssh/sshd_config.d/99-gmk-root.conf && sudo sshd -t && sudo systemctl reload ssh
      command: |
        # Debian / Ubuntu path. The systemd unit is `ssh`.

        # 1. Confirm key-based login works for a non-root account
        last -F | head -10
        # If no recent successful key-based logins exist, set one up
        # FIRST or you'll lock yourself out.

        # 2. Backup the config
        sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak.$(date +%s)

        # 3. Apply the policy via a drop-in (cleanest, won't conflict
        #    with distro upgrades that rewrite sshd_config)
        cat <<'EOF' | sudo tee /etc/ssh/sshd_config.d/99-gmk-root.conf
        PermitRootLogin prohibit-password
        # Tighter alternative; disable root SSH entirely once you
        # confirm a sudo-equipped operator account works:
        # PermitRootLogin no
        PasswordAuthentication no
        # ChallengeResponseAuthentication no  # required on some distros
        EOF

        # 4. Validate the merged config BEFORE restarting sshd
        sudo sshd -t
        # Exit non-zero = config has a typo; STOP, don't restart sshd.

        # 5. Reload sshd (existing sessions unaffected)
        sudo systemctl reload ssh

        # 6. Verify from a NEW terminal (don't close the current one
        #    until you've confirmed the new policy works)
        sudo sshd -T | grep -iE 'permitrootlogin|passwordauthentication'
      description: |
        Debian/Ubuntu path. Use a drop-in under sshd_config.d/
        rather than editing sshd_config directly; survives apt
        upgrades that rewrite the main file. Validate with
        `sshd -t` before reloading.
    - distro_match: ["rhel-*", "rocky-*", "almalinux-*", "centos-*", "fedora-*"]
      vendor_match: ["*"]
      command: |
        # RHEL family path. The systemd unit is `sshd`.

        # 1. Confirm key-based login works for a non-root account
        last -F | head -10

        # 2. Backup
        sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak.$(date +%s)

        # 3. Drop-in policy
        cat <<'EOF' | sudo tee /etc/ssh/sshd_config.d/99-gmk-root.conf
        PermitRootLogin prohibit-password
        # PermitRootLogin no  # tighter; once sudo account confirmed
        PasswordAuthentication no
        EOF

        # 4. Validate
        sudo sshd -t

        # 5. Reload
        sudo systemctl reload sshd

        # 6. Verify
        sudo sshd -T | grep -iE 'permitrootlogin|passwordauthentication'
      description: |
        RHEL family path. Same flow as Debian; only the systemd unit
        name differs (`sshd` vs `ssh`). SELinux note: drop-in files
        under sshd_config.d/ inherit the right context automatically
        when created via tee.
    - distro_match: ["*"]
      vendor_match: ["*"]
      command: |
        # Fallback: distro unknown. Use the universal approach.

        # 1. Confirm key-based login works
        last -F | head -10

        # 2. Detect the systemd unit name
        if systemctl list-unit-files | grep -q '^sshd\.service'; then
          UNIT=sshd
        else
          UNIT=ssh
        fi
        echo "Using unit: $UNIT"

        # 3. Backup + drop-in
        sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak.$(date +%s)
        cat <<'EOF' | sudo tee /etc/ssh/sshd_config.d/99-gmk-root.conf
        PermitRootLogin prohibit-password
        PasswordAuthentication no
        EOF

        # 4. Validate + reload
        sudo sshd -t
        sudo systemctl reload "$UNIT"

        # 5. Verify
        sudo sshd -T | grep -iE 'permitrootlogin|passwordauthentication'
      description: |
        Fallback for unknown distro. Detects the systemd unit name
        dynamically; otherwise identical to the distro-specific
        variants.
  validation:
    command: |
      sudo sshd -T 2>/dev/null | grep -qiE '^permitrootlogin (no|prohibit-password|without-password)'
    expected_exit: 0
    description: |
      Definition of done: exit 0 means the RUNNING sshd no longer permits
      root password login. This reads the live daemon (sshd -T), so it
      also confirms the config was reloaded, not merely edited on disk.
  rollback:
    available: true
    command: |
      sudo rm /etc/ssh/sshd_config.d/99-gmk-root.conf
      sudo sshd -t
      sudo systemctl reload sshd 2>/dev/null || sudo systemctl reload ssh
    note: |
      Remove the drop-in and reload sshd; the policy reverts to
      whatever was in /etc/ssh/sshd_config. If the change locked
      you out, fall back to console access (hosting panel, IPMI,
      or KVM) and remove the drop-in there. NEVER lose access
      because the rollback wasn't tested; verify key auth before
      reload.
  impact:
    blast_radius: |
      Reloading sshd does NOT drop existing SSH sessions; the
      current connection stays alive through the reload. New
      connections that rely on password auth will be rejected.
      No service impact on processes that don't use SSH for inbound.
    estimated_duration: |
      Inspection + key verification: 2-5 minutes. Drop-in apply +
      reload: 1 minute. Verification from a new terminal:
      30 seconds.
    irreversible_steps: false
  provenance:
    last_verified: "2026-05-14"
    tested_on:
      - Inherited from initial rule library
    tester: Glassmkr ops (migration)
    research_basis: operator-pattern
    source_note: |
      Desk-researched from sshd_config(5), sshd(8), systemd unit
      naming conventions on Debian vs RHEL. The drop-in approach
      under sshd_config.d/ is from OpenSSH 7.6+ (universally
      available on the validation fleet). Distro-specific variants
      verified against Debian 12 + Ubuntu 24.04 + AlmaLinux 9 +
      Rocky 9 sshd_config.d/ inclusion order. Not deliberately
      re-triggered on validation fleet (would require deliberately
      enabling root password login first).

      Pattern library 2026-05-18: Category 7 (system state). Hard configuration check; treated as drift not transient. Operator-validated per OPERATIONAL_PATTERN_LIBRARY_2026-05-18.md.
