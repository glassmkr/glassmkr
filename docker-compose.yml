# Glassmkr self-hosted stack: dashboard + Postgres + ClickHouse.
#
# Quickstart (full instructions in SELF_HOSTING.md):
#   cp env.selfhost.example .env
#   ./scripts/selfhost-setup.sh
#   docker compose up -d
#   open http://localhost:3000
#
# ClickHouse migrations are applied by the one-shot clickhouse-migrate service on
# every `up`; they are all idempotent (IF NOT EXISTS), so re-running is safe.
# Postgres migrations are applied by the dashboard entrypoint, which tracks
# applied files and only runs new ones.

services:
  # Runs before anything else and refuses to let the stack start while .env
  # still holds placeholder secrets.
  #
  # env.selfhost.example ships every secret as the literal CHANGE_ME so the
  # file parses from the moment it is copied: Compose interpolates variables
  # for EVERY subcommand, so empty required values used to make even
  # `docker compose down` fail before setup had ever run. The cost of
  # placeholders is that `up` would otherwise be allowed to proceed, and
  # Postgres would initialise its data volume with the placeholder as the
  # superuser password. Setup would then generate a real one, and every
  # subsequent boot would fail authentication against a volume nobody
  # remembers creating. Gating every service on this check keeps the parse fix
  # without introducing that trap.
  preflight:
    image: busybox:1.36
    volumes:
      - ./docker/preflight.sh:/preflight.sh:ro
    command: ["sh", "/preflight.sh"]
    environment:
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      GLASSMKR_KEY_PEPPER: ${GLASSMKR_KEY_PEPPER:-}

  postgres:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      # The cluster superuser. Migrations run as this role because several of
      # them transfer table ownership; the dashboard itself connects as the
      # unprivileged "agent" role created by the initdb script.
      POSTGRES_USER: postgres
      # DISTINCT from DB_PASSWORD. Sharing them would let a leaked application
      # credential authenticate as superuser, and a superuser can rewrite the
      # audit log regardless of ownership, which would make the append-only
      # property decorative. Generated by scripts/selfhost-setup.sh.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run ./scripts/selfhost-setup.sh first}
      POSTGRES_DB: ${DB_NAME:-dashboard}
      # The unprivileged application role's password.
      APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-dashboard}"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-glassmkr}
      # Current ClickHouse images lock the default account, so a client in
      # another container cannot connect without credentials. This is its own
      # secret, not a copy of DB_PASSWORD: distinct credentials per service so
      # one leak does not become three.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-glassmkr}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./scripts/selfhost-setup.sh first}
    ulimits:
      nofile: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER:-glassmkr} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies every migrations/clickhouse/*.sql in numeric order on each
  # `up`. Safe to re-run: every statement is IF NOT EXISTS by convention (CI
  # enforces the SAFE-NOOP discipline on the hosted path; keep new migrations
  # idempotent so this stays true).
  clickhouse-migrate:
    image: clickhouse/clickhouse-server:24.8
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./migrations/clickhouse:/migrations:ro
    environment:
      CH_USER: ${CLICKHOUSE_USER:-glassmkr}
      CH_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./scripts/selfhost-setup.sh first}
      CH_DB: ${CLICKHOUSE_DATABASE:-glassmkr}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -eu
        for f in $$(ls /migrations/*.sql | sort); do
          echo "[ch-migrate] applying $$f"
          clickhouse-client --host clickhouse --user "$$CH_USER" --password "$$CH_PASSWORD" --database "$$CH_DB" --multiquery < "$$f"
        done
        echo "[ch-migrate] done"
    restart: "no"

  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
    environment:
      GLASSMKR_SELF_HOSTED: "1"
      NODE_ENV: production
      PORT: "3000"
      # Postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-agent}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-dashboard}
      DB_ADMIN_USER: postgres
      DB_ADMIN_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run ./scripts/selfhost-setup.sh first}
      # ClickHouse
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-glassmkr}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-glassmkr}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./scripts/selfhost-setup.sh first}
      # Secrets you MUST set in .env (see env.selfhost.example)
      # Without this the app registers accounts happily and then fails every
      # login with "Missing JWT_SECRET". Gate 10 found it: nothing in the
      # compose file had ever set it, and the earlier gates only checked that
      # / returned a redirect, which it does whether or not you can log in.
      JWT_SECRET: ${JWT_SECRET:?run ./scripts/selfhost-setup.sh first}
      GLASSMKR_KEY_PEPPER: ${GLASSMKR_KEY_PEPPER:?set GLASSMKR_KEY_PEPPER in .env}
      # This stack ships no Redis. Point REDIS_URL at one and set
      # REDIS_DISABLED=0 if you run several dashboard replicas and want the
      # token buckets shared; a single container does not need them.
      REDIS_URL: ${REDIS_URL:-}
      REDIS_DISABLED: ${REDIS_DISABLED:-1}
      GLASSMKR_DISABLE_REGISTRATION: ${GLASSMKR_DISABLE_REGISTRATION:-}
      # Where agents and browsers reach this dashboard
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost:3000}
      # Optional: AI analysis via any OpenAI-compatible endpoint
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Optional: outgoing email (alert channels); empty disables email sending
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      # Loopback by default: Docker publishes straight past ufw and firewalld,
      # so "3000:3000" silently exposes the dashboard to the internet on a box
      # whose firewall looks closed. Front it with a reverse proxy, or set
      # DASHBOARD_BIND to a specific address you intend to serve on.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-3000}:3000"

volumes:
  pgdata:
  chdata:
