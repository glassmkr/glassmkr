name: Secret scan + dep audit

# Security audit 2026-05-22, §1.10 (catalog T-704 git-history secrets) +
# §1.11 (T-102 dependency advisories). Two cheap gates on every PR:
#   1. gitleaks detect over the full history + the PR diff
#   2. pnpm audit failing only on CRITICAL (high+ is informational; new
#      moderate/high advisories land weekly and should not red-wall every
#      PR, but a critical is always worth blocking on).
#
# Note: this repo cannot configure required-status-checks on its current
# GitHub tier (private + non-Pro; see SECURITY_AUDIT_FINDINGS_2026-05-22
# open-question 4). These gates therefore surface as visible PR checks
# but are not merge-blocking until the repo goes public or upgrades.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history so gitleaks scans all commits
      # Use the gitleaks BINARY directly, not gitleaks/gitleaks-action.
      # The action wrapper requires a paid GITLEAKS_LICENSE for GitHub
      # organization accounts (free only for personal) and hard-fails the
      # job at a license check before scanning anything -- a pure
      # signal-to-noise misfire on a repo with no secrets. The binary
      # itself is open-source and free for any use. Pinned by version +
      # SHA-256 of the release tarball (supply-chain: don't trust a
      # mutable release asset).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan PR commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Scope the per-PR gate to the PR's NEW commits only. Full-history
          # scanning is a one-time founder exercise (run 2026-05-26: 53
          # pre-existing findings, mostly API-doc placeholder tokens, under
          # separate triage in SECURITY_AUDIT_FINDINGS_2026-05-22.md), NOT a
          # per-PR gate -- otherwise every PR re-fails on history that
          # predates it (the exact noise that erodes the gate's value).
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            gitleaks git --no-banner --redact --verbose --exit-code 1 --log-opts="${BASE_SHA}..HEAD" .
          else
            # Manual run (workflow_dispatch): no PR base, scan the working tree.
            gitleaks dir --no-banner --redact --verbose --exit-code 1 .
          fi

  dep-audit:
    name: dependency audit (critical gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # npm retired the legacy audit endpoint that `pnpm audit` calls (it now
      # returns HTTP 410 at every pnpm version), so scan the pnpm lockfile with
      # osv-scanner (OSV.dev) instead. It reads pnpm-lock.yaml directly, so no
      # install/node_modules is needed.
      - name: Install osv-scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      # Block only on CRITICAL. High+ surfaces in the informational step for
      # awareness but does not fail the run (advisory churn would otherwise
      # red-wall unrelated PRs).
      - name: Audit (critical-only gate)
        run: |
          osv-scanner scan source --lockfile=pnpm-lock.yaml --format=json --output-file=osv.json || true
          CRIT=$(jq '[.results[]?.packages[]?.vulnerabilities[]? | select((.database_specific.severity // "" | ascii_upcase) == "CRITICAL")] | length' osv.json)
          echo "CRITICAL advisories: ${CRIT:-0}"
          test "${CRIT:-0}" -eq 0
      - name: Audit (full, informational)
        if: always()
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml || true
